<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZQY 游戏库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, #0f0f1a 60%, #000 100%);
    min-height: 100vh;
    color: #eee;
    padding: 40px 20px;
    overflow-x: hidden;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 {
    font-size: 28px;
    text-align: center;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ffd700, #ff6b6b, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 40px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }
  .card {
    position: relative;
    border-radius: 18px;
    padding: 28px 22px;
    text-decoration: none;
    color: #fff;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s;
    overflow: hidden;
    display: block;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--c);
    opacity: 0.8;
  }
  .card:active { transform: scale(0.97); }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--c);
    box-shadow: 0 12px 40px -10px var(--c);
  }
  .icon { font-size: 48px; margin-bottom: 14px; display: block; }
  .name { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .desc { font-size: 13px; color: #999; line-height: 1.6; }
  .tag {
    display: inline-block;
    margin-top: 12px;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--c);
    color: #000;
    font-weight: 600;
    opacity: 0.9;
  }
  footer { text-align: center; margin-top: 50px; color: #555; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ZQY 游戏库</h1>
  <div class="sub">点击卡片进入游戏 · 手机 / 电脑均可玩</div>
  <div class="grid">
    <a class="card" style="--c:#f59e0b" href="https://zqy351.github.io/sgs/">
      <span class="icon">♠️</span>
      <div class="name">三国杀 · 一将成名</div>
      <div class="desc">无名杀单机版，含新武将【势曹植】（魏 4 体力）：酒诗 / 七章 / 华</div>
      <span class="tag">卡牌</span>
    </a>
    <a class="card" style="--c:#10b981" href="/game/">
      <span class="icon">🗺️</span>
      <div class="name">大地图探险</div>
      <div class="desc">撤离模式 v10.29 · 大地图探索与物资撤离</div>
      <span class="tag">探索</span>
    </a>
    <a class="card" style="--c:#ef4444" href="/game/operation-ironhold/">
      <span class="icon">🔫</span>
      <div class="name">铁砧要塞 · 仓库区</div>
      <div class="desc">3 分钟突入集装箱货场，十名敌军，移动版汉化</div>
      <span class="tag">FPS</span>
    </a>
  </div>
  <footer>© ZQY · 点击即玩</footer>
</div>
</body>
</html>
